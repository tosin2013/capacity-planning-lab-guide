kind: ConfigMap
apiVersion: v1
metadata:
  name: module-4---right-sizing-activity
  namespace: open-cluster-management-observability
  labels:
    grafana-custom-dashboard: "true"
data:
  module-4---right-sizing-activity.json: |
    {"id": 70, "panels": [{"datasource": {"type": "prometheus", "uid": "${datasource}"}, "description": "CPU utilization as a percentage of requests. Below 30% indicates significant over-provisioning; above 100% means usage exceeds requests.", "fieldConfig": {"defaults": {"min": 0, "max": 200, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 20}, {"color": "green", "value": 40}, {"color": "green", "value": 80}, {"color": "orange", "value": 100}, {"color": "red", "value": 120}]}, "unit": "percent"}}, "gridPos": {"h": 6, "w": 12, "x": 0, "y": 0}, "id": 1, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "orientation": "horizontal", "showThresholdLabels": false, "showThresholdMarkers": true}, "targets": [{"expr": "sum by (pod) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate{namespace=~\"$namespace\", cluster=~\"$cluster\", container!=\"\", container!=\"POD\"}) / sum by (pod) (kube_pod_container_resource_requests{namespace=~\"$namespace\", cluster=~\"$cluster\", resource=\"cpu\"}) * 100", "legendFormat": "{{pod}}", "refId": "A"}], "title": "CPU Utilization vs Requests (%)", "type": "gauge"}, {"datasource": {"type": "prometheus", "uid": "${datasource}"}, "description": "Memory utilization as a percentage of requests. Below 30% indicates over-provisioning; above 100% means usage exceeds requests and OOMKill risk is high.", "fieldConfig": {"defaults": {"min": 0, "max": 200, "thresholds": {"mode": "absolute", "steps": [{"color": "red", "value": null}, {"color": "orange", "value": 20}, {"color": "green", "value": 40}, {"color": "green", "value": 80}, {"color": "orange", "value": 100}, {"color": "red", "value": 120}]}, "unit": "percent"}}, "gridPos": {"h": 6, "w": 12, "x": 12, "y": 0}, "id": 2, "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "orientation": "horizontal", "showThresholdLabels": false, "showThresholdMarkers": true}, "targets": [{"expr": "sum by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\", cluster=~\"$cluster\", container!=\"\", container!=\"POD\"}) / sum by (pod) (kube_pod_container_resource_requests{namespace=~\"$namespace\", cluster=~\"$cluster\", resource=\"memory\"}) * 100", "legendFormat": "{{pod}}", "refId": "A"}], "title": "Memory Utilization vs Requests (%)", "type": "gauge"}, {"datasource": {"type": "prometheus", "uid": "${datasource}"}, "description": "Time-series comparison of CPU requests (what each deployment asked for) versus actual CPU usage. A persistent gap between the lines indicates over-provisioning.", "fieldConfig": {"defaults": {"custom": {"lineWidth": 2}, "unit": "cores"}}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 6}, "id": 3, "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}, "targets": [{"expr": "sum by (pod) (kube_pod_container_resource_requests{namespace=~\"$namespace\", cluster=~\"$cluster\", resource=\"cpu\"})", "legendFormat": "Requested: {{pod}}", "refId": "A"}, {"expr": "sum by (pod) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate{namespace=~\"$namespace\", cluster=~\"$cluster\", container!=\"\", container!=\"POD\"})", "legendFormat": "Actual: {{pod}}", "refId": "B"}], "title": "CPU: Requested vs Actual Usage (per Pod)", "type": "timeseries"}, {"datasource": {"type": "prometheus", "uid": "${datasource}"}, "description": "Time-series comparison of memory requests versus actual working-set memory. When usage exceeds the limit line, OOMKills occur.", "fieldConfig": {"defaults": {"custom": {"lineWidth": 2}, "unit": "bytes"}}, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 6}, "id": 4, "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}, "targets": [{"expr": "sum by (pod) (kube_pod_container_resource_requests{namespace=~\"$namespace\", cluster=~\"$cluster\", resource=\"memory\"})", "legendFormat": "Requested: {{pod}}", "refId": "A"}, {"expr": "sum by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\", cluster=~\"$cluster\", container!=\"\", container!=\"POD\"})", "legendFormat": "Actual: {{pod}}", "refId": "B"}, {"expr": "sum by (pod) (kube_pod_container_resource_limits{namespace=~\"$namespace\", cluster=~\"$cluster\", resource=\"memory\"})", "legendFormat": "Limit: {{pod}}", "refId": "C"}], "title": "Memory: Requested vs Actual vs Limit (per Pod)", "type": "timeseries"}, {"datasource": {"type": "prometheus", "uid": "${datasource}"}, "description": "Container restart count per pod in the namespace. Rising restarts often indicate OOMKills or CrashLoopBackOff caused by resource misconfigurations.", "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 1}, {"color": "red", "value": 5}]}, "unit": "short"}}, "gridPos": {"h": 6, "w": 12, "x": 0, "y": 14}, "id": 5, "options": {"colorMode": "background", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"]}, "textMode": "auto"}, "targets": [{"expr": "sum by (pod) (kube_pod_container_status_restarts_total{namespace=~\"$namespace\", cluster=~\"$cluster\"})", "legendFormat": "{{pod}}", "refId": "A"}], "title": "Container Restarts (OOMKill Indicator)", "type": "stat"}, {"datasource": {"type": "prometheus", "uid": "${datasource}"}, "description": "CPU throttling rate per pod. Values above 5% indicate the CPU limit is too restrictive; above 25% signals severe performance degradation.", "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.05}, {"color": "red", "value": 0.25}]}, "unit": "percentunit"}}, "gridPos": {"h": 6, "w": 12, "x": 12, "y": 14}, "id": 6, "options": {"colorMode": "background", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"]}, "textMode": "auto"}, "targets": [{"expr": "sum by (pod) (rate(container_cpu_cfs_throttled_seconds_total{namespace=~\"$namespace\", cluster=~\"$cluster\", container!=\"\"}[10m]))", "legendFormat": "{{pod}}", "refId": "A"}], "title": "CPU Throttling Rate (per Pod)", "type": "stat"}, {"datasource": {"type": "prometheus", "uid": "${datasource}"}, "description": "CPU waste per pod: the gap between requested CPU and actual usage. Higher bars mean more wasted capacity that could be reclaimed.", "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 0.1}, {"color": "red", "value": 0.3}]}, "unit": "cores"}}, "gridPos": {"h": 8, "w": 12, "x": 0, "y": 20}, "id": 7, "options": {"displayMode": "gradient", "orientation": "horizontal", "reduceOptions": {"calcs": ["lastNotNull"]}, "showUnfilled": true}, "targets": [{"expr": "sum by (pod) (kube_pod_container_resource_requests{namespace=~\"$namespace\", cluster=~\"$cluster\", resource=\"cpu\"}) - sum by (pod) (node_namespace_pod_container:container_cpu_usage_seconds_total:sum_rate{namespace=~\"$namespace\", cluster=~\"$cluster\", container!=\"\", container!=\"POD\"})", "legendFormat": "{{pod}}", "refId": "A"}], "title": "CPU Waste by Pod (Requested - Used)", "type": "bargauge"}, {"datasource": {"type": "prometheus", "uid": "${datasource}"}, "description": "Memory waste per pod: the gap between requested memory and actual working-set usage. Negative values mean the pod is using more than requested.", "fieldConfig": {"defaults": {"thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}, {"color": "yellow", "value": 67108864}, {"color": "red", "value": 268435456}]}, "unit": "bytes"}}, "gridPos": {"h": 8, "w": 12, "x": 12, "y": 20}, "id": 8, "options": {"displayMode": "gradient", "orientation": "horizontal", "reduceOptions": {"calcs": ["lastNotNull"]}, "showUnfilled": true}, "targets": [{"expr": "sum by (pod) (kube_pod_container_resource_requests{namespace=~\"$namespace\", cluster=~\"$cluster\", resource=\"memory\"}) - sum by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\", cluster=~\"$cluster\", container!=\"\", container!=\"POD\"})", "legendFormat": "{{pod}}", "refId": "A"}], "title": "Memory Waste by Pod (Requested - Used)", "type": "bargauge"}], "refresh": "10s", "schemaVersion": 36, "tags": ["capacity-planning", "module-04", "workshop", "right-sizing"], "templating": {"list": [{"current": {}, "label": "Prometheus datasource", "name": "datasource", "query": "prometheus", "type": "datasource"}, {"allValue": ".*", "current": {"text": "All", "value": "$__all"}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "includeAll": true, "label": "Cluster", "multi": false, "name": "cluster", "query": "label_values(kube_pod_info, cluster)", "refresh": 2, "sort": 1, "type": "query"}, {"current": {"text": "right-sizing-lab", "value": "right-sizing-lab"}, "datasource": {"type": "prometheus", "uid": "${datasource}"}, "includeAll": false, "label": "Namespace", "multi": false, "name": "namespace", "options": [{"selected": true, "text": "right-sizing-lab", "value": "right-sizing-lab"}, {"selected": false, "text": "capacity-workshop", "value": "capacity-workshop"}], "query": "right-sizing-lab,capacity-workshop", "type": "custom"}]}, "timezone": "browser", "title": "Module 4 \u2014 Right-Sizing Activity", "version": 1}
