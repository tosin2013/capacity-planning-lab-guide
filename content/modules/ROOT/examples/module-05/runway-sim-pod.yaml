---
# kube-burner Deployment template — Module 5 Capacity Runway simulation
# Uses the lightweight pause image (no actual CPU burn) so the simulation
# affects kube_pod_container_resource_requests without stressing the node.
kind: Deployment
apiVersion: apps/v1
metadata:
  name: runway-sim-{{.Iteration}}
  labels:
    kube-burner-job: runway-sim
    app: runway-sim
spec:
  replicas: {{.Replicas}}
  selector:
    matchLabels:
      app: runway-sim-{{.Iteration}}
  template:
    metadata:
      labels:
        app: runway-sim-{{.Iteration}}
        kube-burner-job: runway-sim
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 300m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
