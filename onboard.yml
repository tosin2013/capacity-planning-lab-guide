# onboard.yml — Onboarding manifest for capacity-planning-lab-guide
# Spec version 1.0
#
# Strategic Capacity Planning & Forecasting for OpenShift at Scale
# Hub-student topology deployed via AgnosticD v2 on AWS.

name: capacity-planning-lab-guide
description: Strategic Capacity Planning & Forecasting workshop (OpenShift + RHACM hub-student topology)
deploy_script: scripts/deploy-workshop.sh

# ─────────────────────────────────────────────────────────────
# Prerequisites
# ─────────────────────────────────────────────────────────────

prerequisites:
  - name: python3
    check_command: "python3 --version"
    version_regex: "Python (\\d+\\.\\d+)"
    min_version: "3.12"
    install:
      macos: "brew install python@3.12"
      rhel9: "sudo dnf install -y python3.12"
      rhel8: "sudo dnf install -y python3.12"
      fedora: "sudo dnf install -y python3.12"
      debian: "sudo apt-get install -y python3"
      fallback: "Install Python 3.12+ from https://python.org"

  - name: podman
    check_command: "podman --version"
    version_regex: "podman version (\\d+\\.\\d+)"
    min_version: "5.0"
    install:
      macos: "brew install podman"
      rhel9: "sudo dnf install -y podman"
      rhel8: "sudo dnf install -y podman"
      fedora: "sudo dnf install -y podman"
      debian: "sudo apt-get install -y podman"
      fallback: "Install Podman 5+ from https://podman.io"

  - name: awscli
    check_command: "aws --version"
    version_regex: "aws-cli/(\\d+\\.\\d+)"
    install:
      macos: "brew install awscli"
      rhel9: "sudo dnf install -y awscli2"
      rhel8: "pip3 install awscli"
      fedora: "sudo dnf install -y awscli2"
      debian: "sudo apt-get install -y awscli"
      fallback: "Install AWS CLI v2 from https://aws.amazon.com/cli/"

  - name: sshpass
    check_command: "command -v sshpass"
    install:
      macos: "brew install esolitos/ipa/sshpass"
      rhel9: "sudo dnf install -y sshpass"
      rhel8: "sudo dnf install -y sshpass"
      fedora: "sudo dnf install -y sshpass"
      debian: "sudo apt-get install -y sshpass"
      fallback: "Install sshpass from your package manager"

  - name: git
    check_command: "git --version"
    install:
      macos: "brew install git"
      rhel9: "sudo dnf install -y git"
      rhel8: "sudo dnf install -y git"
      fedora: "sudo dnf install -y git"
      debian: "sudo apt-get install -y git"
      fallback: "Install git from https://git-scm.com"

  - name: jq
    check_command: "jq --version"
    install:
      macos: "brew install jq"
      rhel9: "sudo dnf install -y jq"
      rhel8: "sudo dnf install -y jq"
      fedora: "sudo dnf install -y jq"
      debian: "sudo apt-get install -y jq"
      fallback: "Install jq from https://jqlang.github.io/jq/"

  - name: yq
    check_command: "yq --version"
    install:
      macos: "brew install yq"
      rhel9: "sudo curl -sSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq && sudo chmod +x /usr/local/bin/yq"
      rhel8: "sudo curl -sSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq && sudo chmod +x /usr/local/bin/yq"
      fedora: "sudo dnf install -y yq"
      debian: "sudo curl -sSL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq && sudo chmod +x /usr/local/bin/yq"
      fallback: "Download yq from https://github.com/mikefarah/yq/releases"

# ─────────────────────────────────────────────────────────────
# Setup Steps
# ─────────────────────────────────────────────────────────────

setup_steps:
  - name: "Clone AgnosticD v2"
    check: "test -x ${agnosticd_root}/bin/agd"
    action: "git clone https://github.com/agnosticd/agnosticd-v2.git ${agnosticd_root}"
    prompt_var: agnosticd_root
    prompt: "AgnosticD v2 install path"
    default: "~/agnosticd-v2"

  - name: "Run agd setup"
    check: "test -d ${agnosticd_root}/../agnosticd-v2-vars"
    action: "cd ${agnosticd_root} && ./bin/agd setup"

  - name: "Bootstrap hub var file"
    check: "test -f ${agnosticd_root}/../agnosticd-v2-vars/hub-aws.yml"
    action: "cp deploy/vars/hub-aws.yml ${agnosticd_root}/../agnosticd-v2-vars/hub-aws.yml"

  - name: "Scaffold secrets file"
    check: "test -f ${agnosticd_root}/../agnosticd-v2-secrets/secrets-${account}.yml"
    action: "cp deploy/vars/secrets.yml.example ${agnosticd_root}/../agnosticd-v2-secrets/secrets-${account}.yml"

# ─────────────────────────────────────────────────────────────
# Configuration Prompts
# ─────────────────────────────────────────────────────────────

config:
  output_file: deploy/config.yml
  gitignore: true

  prompts:
    - key: account
      prompt: "RHDP sandbox account name (matches secrets filename, e.g. sandbox1234)"
      default: ""
      required: true

    - key: aws_region
      prompt: "AWS region"
      default: "us-east-2"

    - key: num_students
      prompt: "Number of student clusters"
      default: "3"

    - key: owner_email
      prompt: "Owner email (AWS resource tag)"
      default: ""

    - key: hub_guid
      prompt: "Hub cluster GUID"
      default: "hub-capacity"

    - key: base_domain
      prompt: "Base domain (must have Route53 hosted zone, e.g. sandbox1234.opentlc.com)"
      default: ""
      required: true

    - key: pull_secret_path
      prompt: "Path to OpenShift pull secret"
      default: "~/pull-secret.json"

    - key: agnosticd_root
      prompt: "AgnosticD v2 install path"
      default: "~/agnosticd-v2"

# ─────────────────────────────────────────────────────────────
# Validation Checks
# ─────────────────────────────────────────────────────────────

validation:
  - name: "AWS credentials"
    command: "aws sts get-caller-identity"
    required: false
    fail_message: >-
      AWS credentials not configured.
      Run 'aws configure' or set AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY.
      For RHDP sandboxes, credentials are emailed after ordering.

  - name: "Pull secret exists"
    command: "test -f ${pull_secret_path}"
    required: true
    fail_message: >-
      Pull secret not found at ${pull_secret_path}.
      Download from https://console.redhat.com/openshift/install/pull-secret

  - name: "Pull secret is valid JSON"
    command: "python3 -m json.tool ${pull_secret_path} > /dev/null 2>&1"
    required: true
    fail_message: "Pull secret file is not valid JSON. Re-download it from console.redhat.com."

  - name: "AgnosticD agd binary"
    command: "test -x ${agnosticd_root}/bin/agd"
    required: true
    fail_message: >-
      AgnosticD not found at ${agnosticd_root}/bin/agd.
      Re-run project-onboard or: git clone https://github.com/agnosticd/agnosticd-v2.git ${agnosticd_root}

  - name: "Secrets file exists"
    command: "test -f ${agnosticd_root}/../agnosticd-v2-secrets/secrets-${account}.yml"
    required: true
    fail_message: >-
      Secrets file not found. Create from template:
      cp deploy/vars/secrets.yml.example ~/agnosticd-v2-secrets/secrets-${account}.yml

  - name: "Hub var file present"
    command: "test -f ${agnosticd_root}/../agnosticd-v2-vars/hub-aws.yml"
    required: true
    fail_message: >-
      Hub var file missing. Bootstrap from template:
      cp deploy/vars/hub-aws.yml ~/agnosticd-v2-vars/hub-aws.yml

  - name: "Route53 hosted zone"
    command: "test -n \"$(aws route53 list-hosted-zones --query \"HostedZones[?Name=='${base_domain}.'].Id\" --output text)\""
    required: false
    fail_message: >-
      No Route53 hosted zone found for ${base_domain}.
      The OpenShift installer requires a public hosted zone.
      RHDP sandboxes provide this automatically.

# ─────────────────────────────────────────────────────────────
# Quota Checks (run before deployment)
# ─────────────────────────────────────────────────────────────

quota_checks:
  - label: "EC2 vCPUs (On-Demand Standard)"
    needed: 96
    limit_command: "aws service-quotas get-service-quota --service-code ec2 --quota-code L-1216C47A --region ${aws_region} --query 'Quota.Value' --output text"
    usage_command: "aws ec2 describe-instances --region ${aws_region} --filters Name=instance-state-name,Values=running --query 'Reservations[].Instances[] | length(@)' --output text"
    fail_message: >-
      Insufficient vCPUs. Run: make request-quotas (or: bash scripts/request-quotas.sh)

  - label: "Elastic IPs"
    needed: 16
    limit_command: "aws service-quotas get-service-quota --service-code ec2 --quota-code L-0263D0A3 --region ${aws_region} --query 'Quota.Value' --output text"
    usage_command: "aws ec2 describe-addresses --region ${aws_region} --query 'Addresses | length(@)' --output text"
    fail_message: >-
      Insufficient Elastic IPs. Run: make request-quotas (or: bash scripts/request-quotas.sh)

  - label: "VPCs"
    needed: 8
    limit_command: "aws service-quotas get-service-quota --service-code vpc --quota-code L-F678F1CE --region ${aws_region} --query 'Quota.Value' --output text"
    usage_command: "aws ec2 describe-vpcs --region ${aws_region} --query 'Vpcs | length(@)' --output text"
    fail_message: >-
      Insufficient VPCs. Run: make request-quotas (or: bash scripts/request-quotas.sh)

  - label: "NAT Gateways"
    needed: 8
    limit_command: "aws service-quotas get-service-quota --service-code vpc --quota-code L-FE5A380F --region ${aws_region} --query 'Quota.Value' --output text"
    usage_command: "aws ec2 describe-nat-gateways --region ${aws_region} --filter Name=state,Values=available --query 'NatGateways | length(@)' --output text"
    fail_message: >-
      Insufficient NAT Gateways. Run: make request-quotas (or: bash scripts/request-quotas.sh)

# ─────────────────────────────────────────────────────────────
# Post-Setup Message
# ─────────────────────────────────────────────────────────────

post_setup:
  message: |
    Setup complete! Next steps:

    1. Fill in your AWS credentials and pull secret in:
       ${agnosticd_root}/../agnosticd-v2-secrets/secrets-${account}.yml

       Required fields:
         aws_access_key_id: "AKIA..."
         aws_secret_access_key: "..."
         base_domain: "${base_domain}"
         ocp4_pull_secret: '<paste full JSON>'

    2. Edit var files and replace <YOUR_EMAIL> with your email:
       ${agnosticd_root}/../agnosticd-v2-vars/hub-aws.yml
       ${agnosticd_root}/../agnosticd-v2-vars/student-*.yml

    3. Deploy (full run, ~3-4 hours):
       bash scripts/deploy-workshop.sh --account ${account}

       Or preview without deploying:
       bash scripts/deploy-workshop.sh --account ${account} --dry-run

    4. After deployment, student access info is in:
       student-info.txt

    5. Teardown when finished:
       cd ${agnosticd_root} && bin/agd destroy --guid ${hub_guid} --account ${account}

    Full reference: docs/hub-student-deployment.md

# ─────────────────────────────────────────────────────────────
# Modes (dev = maintainers, prod = end users)
# ─────────────────────────────────────────────────────────────

modes:
  dev:
    description: "Set up maintainer/contributor development environment (local Antora preview, linting)"
    phases: [prerequisites, setup_steps, config, validation]
    extra_prerequisites:
      - name: shellcheck
        check_command: "command -v shellcheck"
        install:
          macos: "brew install shellcheck"
          rhel9: "sudo dnf install -y ShellCheck"
          rhel8: "sudo dnf install -y ShellCheck"
          fedora: "sudo dnf install -y ShellCheck"
          debian: "sudo apt-get install -y shellcheck"
          fallback: "Install ShellCheck from https://www.shellcheck.net/"
      - name: yamllint
        check_command: "command -v yamllint"
        install:
          macos: "brew install yamllint"
          rhel9: "pip3 install yamllint"
          rhel8: "pip3 install yamllint"
          fedora: "sudo dnf install -y yamllint"
          debian: "sudo apt-get install -y yamllint"
          fallback: "pip3 install yamllint"
      - name: nodejs
        check_command: "node --version"
        version_regex: "v(\\d+)"
        min_version: "18"
        install:
          macos: "brew install node@18"
          rhel9: "sudo dnf module install -y nodejs:18"
          rhel8: "sudo dnf module install -y nodejs:18"
          fedora: "sudo dnf install -y nodejs"
          debian: "sudo apt-get install -y nodejs"
          fallback: "Install Node.js 18+ from https://nodejs.org"
  prod:
    description: "Set up and deploy the full workshop environment (hub + student clusters on AWS)"
    phases: [prerequisites, setup_steps, config, validation, deploy]
    post_validation_command: "bash scripts/deploy-workshop.sh --account ${account} --hub-guid ${hub_guid} --students \"$(printf '%02d ' $(seq 1 ${num_students}) | sed 's/ $//')\""
